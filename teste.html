<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efeito de Clique nos Slides</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .slide-container {
            width: 80%;
            max-width: 800px;
            background: #2d2d2d;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

        h2 {
            margin-top: 0;
            color: #4CAF50;
        }

        /* O elemento começa invisível, deslocado para baixo e sem ocupar espaço físico visual */
        .reveal-div {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
            margin: 20px 0;
            padding: 15px;
            background: #3d3d3d;
            border-left: 4px solid #4CAF50;
            border-radius: 4px;
            pointer-events: none;
            /* Evita interação enquanto estiver oculto */
        }

        /* Classe ativada via JavaScript ao clicar */
        .reveal-div.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

    </style>
</head>

<body>

    <div class="slide-container">
        <h2>Meu Tópico Principal</h2>

        <div class="reveal-div">
            <p><strong>Primeiro ponto:</strong> Este bloco aparece no primeiro clique.</p>
        </div>

        <div class="reveal-div">
            <p><strong>Segundo ponto:</strong> Este bloco aparece no segundo clique.</p>
        </div>

        <div class="reveal-div">
            <p><strong>Terceiro ponto:</strong> Este bloco aparece no terceiro clique.</p>
        </div>

    </div>

   

</body>

</html>
