<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .caixa {
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s;
            margin-top: 15px;
            padding: 20px;
            background-color: #f0f4f8;
            border-left: 4px solid #3182ce;
            border-radius: 4px;
            width: 300px;
        }

        /* Estado quando a div está visível */
        .caixa.ativo {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
    </style>
</head>

<body>
    <button id="meuBotao">Alternar Div (ou use as setas do teclado)</button>

    <div id="minhaDiv" class="caixa">
        <p>Olá! Eu apareci por clique ou teclado.</p>
    </div>
    <script>
        const botao = document.getElementById('meuBotao');
        const divAlvo = document.getElementById('minhaDiv');

        // Função para alternar a classe ativo
        function alternarDiv() {
            divAlvo.classList.toggle('ativo');
        }

        // Evento de clique no botão
        botao.addEventListener('click', alternarDiv);

        // Evento de teclado (exemplo: usando a seta para baixo ou seta para cima)
        window.addEventListener('keydown', (evento) => {
            // Você pode mudar para 'ArrowDown', 'ArrowUp', 'ArrowLeft', ou 'ArrowRight'
            if (evento.key === 'ArrowRight') {
                evento.preventDefault(); // Evita o comportamento padrão da página rolar com a seta
                alternarDiv();
            }
        }

        );
    </script>
</body>

</html>
