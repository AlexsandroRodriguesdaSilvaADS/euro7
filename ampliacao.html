<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <style>
        /* Elemento miniatura */
        .thumb {
            width: 200px;
            padding: 15px;
            background: #10b981;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .thumb:hover {
            transform: scale(1.03);
        }

        /* Fundo escuro (Overlay) */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        /* Estado ativo do Overlay */
        .overlay.ativo {
            opacity: 1;
            pointer-events: auto;
        }

        /* Conteúdo Ampliado no centro */
        .conteudo-ampliado {
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 12px;
            max-width: 80%;
            transform: scale(0.7);
            transition: transform 0.3s ease;
        }

        .overlay.ativo .conteudo-ampliado {
            transform: scale(1);
        }
    </style>
</head>

<body>

    <!-- Elemento na página -->
    <div class="thumb" onclick="abrirZoom()">
        Clique para ver em ecrã inteiro
    </div>

    <!-- Overlay Modal -->
    <div class="overlay" id="meuOverlay" onclick="fecharZoom()">
        <div class="conteudo-ampliado" onclick="event.stopPropagation()">
            <h2>Elemento Ampliado</h2>
            <p>Este conteúdo está agora em destaque no centro do ecrã.</p>
            <button onclick="fecharZoom()">Fechar</button>
        </div>
    </div>

    <script>
        function abrirZoom() {
            document.getElementById('meuOverlay').classList.add('ativo');
        }

        function fecharZoom() {
            document.getElementById('meuOverlay').classList.remove('ativo');
        }
    </script>

</body>

</html>
